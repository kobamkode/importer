<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Kanistr (film canister)</title>
  <rect width="1024" height="1024" rx="220" fill="#141A24"/>
  <rect x="8" y="8" width="1008" height="1008" rx="212" fill="none"
        stroke="#ffffff" stroke-opacity="0.05" stroke-width="3"/>

  <g transform="translate(512 512) scale(1.6) translate(-512 -470) translate(-32 0)">
  <!-- transfer arrow: head as tall as the canister, short tail -->
  <path d="M 460 505 H 580" fill="none" stroke="#2F6FEB" stroke-width="130"
        stroke-linecap="round"/>
  <path d="M 580 340 L 810 505 L 580 670 Z" fill="#2F6FEB"
        stroke="#2F6FEB" stroke-width="16" stroke-linejoin="round"/>

  <!-- film canister -->
  <rect x="360" y="270" width="70" height="38" rx="12" fill="#B9C4D2"/>
  <rect x="278" y="300" width="234" height="54" rx="22" fill="#F7F9FB"/>
  <rect x="290" y="340" width="210" height="330" rx="24" fill="#E6EDF3"/>

  <!-- film label -->
  <rect x="290" y="440" width="210" height="130" fill="#2F6FEB"/>
  <g fill="#141A24">
    <rect x="308" y="452" width="14" height="14"/>
    <rect x="348" y="452" width="14" height="14"/>
    <rect x="388" y="452" width="14" height="14"/>
    <rect x="428" y="452" width="14" height="14"/>
    <rect x="468" y="452" width="14" height="14"/>
    <rect x="308" y="554" width="14" height="14"/>
    <rect x="348" y="554" width="14" height="14"/>
    <rect x="388" y="554" width="14" height="14"/>
    <rect x="428" y="554" width="14" height="14"/>
    <rect x="468" y="554" width="14" height="14"/>
  </g>
  </g>
</svg>
